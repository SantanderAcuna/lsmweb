# ---------------------------------------------------------------------------
# lsmweb — local/dev orchestration
#
# Topology:
#   browser -> frontend (nginx:alpine, serves SPA)              :8080 -> 80
#   browser -> nginx-backend (nginx:alpine, reverse proxy)      :8000 -> 80
#                       \-- fastcgi --> backend (php-fpm)            :9000
#   backend -> mysql (named volume)                              :3306
#   backend -> redis (optional cache/queue)                      :6379
#
# nginx-backend is intentionally separate from the php-fpm container so each
# image has a single responsibility and can be scaled / replaced independently
# (e.g. swap nginx for Caddy without rebuilding PHP).
# ---------------------------------------------------------------------------

name: lsmweb

services:

  # -------------------- MySQL --------------------
  mysql:
    image: mysql:8.0
    container_name: lsmweb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lsmweb-net

  # -------------------- Redis (optional) --------------------
  # Used for cache/sessions/queue if CACHE_STORE=redis. Disable via `--profile`
  # if not needed: docker compose up (without `--profile redis`) skips it.
  redis:
    image: redis:7-alpine
    container_name: lsmweb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["redis", "full"]
    networks:
      - lsmweb-net

  # -------------------- Backend (php-fpm) --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lsmweb/backend:local
    container_name: lsmweb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Bind mount only storage so logs/cache persist host-side; code is baked
      # in at build time. Remove this volume for fully immutable prod images.
      - backend-storage:/var/www/html/storage
    expose:
      - "9000"
    networks:
      - lsmweb-net

  # -------------------- nginx in front of php-fpm --------------------
  # Reverse proxy: terminates HTTP, forwards FastCGI to `backend:9000`.
  # Kept separate so the PHP image stays minimal and stateless.
  nginx-backend:
    image: nginx:alpine
    container_name: lsmweb-nginx-backend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BACKEND_HTTP_PORT:-8000}:80"
    volumes:
      # Inline reverse-proxy config; lives next to the compose file so it is
      # versioned with the orchestration, not the app.
      - ./backend:/var/www/html:ro
    command: |
      sh -c "cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          index index.php;
          client_max_body_size 25m;

          location / {
              try_files \$$uri \$$uri/ /index.php?\$$query_string;
          }

          location ~ \.php\$$ {
              fastcgi_pass backend:9000;
              fastcgi_index index.php;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME \$$document_root\$$fastcgi_script_name;
              fastcgi_param PATH_INFO \$$fastcgi_path_info;
          }

          location ~ /\.(?!well-known).* {
              deny all;
          }
      }
      EOF
      exec nginx -g 'daemon off;'"
    networks:
      - lsmweb-net

  # -------------------- Frontend (built SPA, nginx) --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lsmweb/frontend:local
    container_name: lsmweb-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    networks:
      - lsmweb-net

# ---------------------------------------------------------------------------
# Networks & volumes
# ---------------------------------------------------------------------------
networks:
  lsmweb-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  backend-storage:
    driver: local
