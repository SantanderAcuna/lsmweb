# ---------------------------------------------------------------------------
# SPA nginx config — Vue Router (history mode) friendly.
# Any non-file request is rewritten to /index.html so the SPA router handles it.
# ---------------------------------------------------------------------------

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Security headers (Resolución 1519/2020 baseline) ----
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # ---- Long-cache for hashed Vite assets ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: serve file if it exists, otherwise index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Health endpoint ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Hide nginx version ----
    server_tokens off;
}
